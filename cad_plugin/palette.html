<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CADverse</title>
  <style>
    :root {
      --bg-primary:   #1e1e1e;
      --bg-secondary: #2a2a2a;
      --bg-input:     #2d2d2d;
      --border:       #333;
      --border-focus: #e07b39;
      --text-primary: #d4d4d4;
      --text-secondary: #888;
      --text-bright:  #ffffff;
      --accent:       #e07b39;
      --success:      #4ec94e;
      --danger:       #e85d5d;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-primary:   #f3f3f3;
        --bg-secondary: #e8e8e8;
        --bg-input:     #ffffff;
        --border:       #cccccc;
        --border-focus: #e07b39;
        --text-primary: #1e1e1e;
        --text-secondary: #666666;
        --text-bright:  #000000;
        --accent:       #e07b39;
        --success:      #2d9f42;
        --danger:       #c94545;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 12px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-bright);
    }

    .dot-server-status {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--border);
    }

    .dot-server-status.connected { background: #e07b39; }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 10px 0;
    }

    .section-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    #setup-section { display: block; }
    #main-section  { display: none; }

    .field { margin-bottom: 8px; }

    .field label {
      display: block;
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 3px;
    }

    .field input {
      width: 100%;
      padding: 5px 8px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
    }

    .field input:focus { border-color: var(--border-focus); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: opacity .15s;
    }

    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .35; cursor: default; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
    }

    .btn-pause {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      flex: 1;
    }

    .btn-export {
      background: var(--accent);
      color: #fff;
      width: 100%;
      margin-top: 4px;
    }

    .controls-row {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 10px;
      margin-bottom: 2px;
    }

    .info-grid .key   { color: var(--text-secondary); }
    .info-grid .value { color: var(--text-primary); word-break: break-all; }

    .member-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .member-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      background: var(--bg-secondary);
      border-radius: 4px;
    }

    .member-name { font-size: 13px; color: var(--text-primary); }
    .member-name.me { color: var(--text-bright); font-weight: 600; }

    .indicators { display: flex; gap: 5px; align-items: center; }

    .ind {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--border);
    }

    .ind.orange { background: #e07b39; }
    .ind.blue   { background: #4a9edd; }
    .ind.green  { background: #4ec94e; }

    .mode-toggle {
      display: flex;
      background: var(--bg-secondary);
      border-radius: 4px;
      padding: 2px;
      margin-bottom: 12px;
    }

    .mode-btn {
      flex: 1;
      padding: 5px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      border-radius: 3px;
      transition: all .15s;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .hint {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 10px;
      line-height: 1.45;
    }

    .status-box {
      display: none;
      padding: 7px 8px;
      border-radius: 4px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      font-size: 11px;
      line-height: 1.45;
      margin-top: 8px;
      word-break: break-all;
    }

    .status-box.success {
      display: block;
      border-color: var(--success);
      color: var(--text-primary);
    }

    .status-box.error {
      display: block;
      border-color: var(--danger);
      color: var(--text-primary);
    }

    .status-title {
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 3px;
    }

    .status-small {
      color: var(--text-secondary);
      margin-top: 2px;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="dot-server-status" id="server-dot"></div>
    <h1>CADverse</h1>
  </div>

  <div id="setup-section">
    <div class="section-label">초기 설정</div>

    <div class="mode-toggle">
      <button class="mode-btn active" id="mode-create" onclick="setMode('create')">새 그룹 만들기</button>
      <button class="mode-btn" id="mode-join" onclick="setMode('join')">그룹 참여</button>
    </div>

    <div class="field">
      <label>사용자 이름</label>
      <input type="text" id="input-username" placeholder="예: kim">
    </div>

    <div class="field">
      <label>그룹 이름</label>
      <input type="text" id="input-group" placeholder="예: lab01">
    </div>

    <div class="field" id="field-password" style="display:none">
      <label>그룹 비밀번호</label>
      <input type="password" id="input-password" placeholder="비밀번호">
    </div>

    <button class="btn btn-primary" onclick="saveConfig()">시작</button>
  </div>

  <div id="main-section">
    <div class="section-label">그룹 정보</div>

    <div class="info-grid">
      <span class="key">그룹</span>    <span class="value" id="disp-group">—</span>
      <span class="key">비밀번호</span> <span class="value" id="disp-pw">—</span>
      <span class="key">나</span>      <span class="value" id="disp-me">—</span>
    </div>

    <hr>

    <div class="section-label">모델 추출</div>
    <button class="btn btn-export" id="btn-export" onclick="exportModel()">
      ⬇ 현재 CAD 모델 추출
    </button>

    <div class="status-box" id="export-status">
      <div class="status-title" id="export-status-title">—</div>
      <div id="export-status-body">—</div>
      <div class="status-small" id="export-status-small"></div>
    </div>

    <p class="hint">
      추출하면 sim_server/models/&lt;사용자 이름&gt;/ 아래에 metadata.json과 meshes 폴더가 생성됩니다.
    </p>

    <hr>

    <div class="controls-row">
      <button class="btn btn-pause" id="btn-pause" disabled onclick="togglePause()">
        ⏸ 일시정지
      </button>
      <button class="btn btn-outline" id="btn-qr" disabled onclick="showQr()">
        QR 표시
      </button>
    </div>

    <hr>

    <div class="section-label">그룹원</div>
    <div class="member-list" id="member-list"></div>

    <p class="hint" id="hint-idle">모델을 추출하면 시뮬레이션 준비에 사용할 수 있습니다.</p>
  </div>

  <script>
    // ── Fusion 360 → JS 메시지 수신 ────────────────────────────────────────────
    window.fusionJavaScriptHandler = {
      handleData: function(action, data) {
        const d = data ? JSON.parse(data) : {};

        if (action === 'config_saved')  onConfigSaved(d);
        if (action === 'status')        onStatus(d);
        if (action === 'export_done')   onExportDone(d);
        if (action === 'export_error')  onExportError(d);
        if (action === 'unknown_action') onExportError(d);
      }
    };

    // ── JS → Fusion 360 메시지 송신 ────────────────────────────────────────────
    function sendToFusion(action, data) {
      if (window.adsk) {
        window.adsk.fusionSendData(action, JSON.stringify(data || {}));
      } else {
        showExportStatus(
          'error',
          'Fusion 연결 오류',
          'window.adsk 객체를 찾지 못했습니다.',
          'Fusion 360 palette 환경에서 실행 중인지 확인하세요.'
        );
      }
    }

    // ── 모드 전환 ───────────────────────────────────────────────────────────────
    let _mode = 'create';

    function setMode(mode) {
      _mode = mode;
      document.getElementById('mode-create').classList.toggle('active', mode === 'create');
      document.getElementById('mode-join').classList.toggle('active', mode === 'join');
      document.getElementById('field-password').style.display = mode === 'join' ? 'block' : 'none';
    }

    // ── 초기 설정 저장 ──────────────────────────────────────────────────────────
    function saveConfig() {
      const username = document.getElementById('input-username').value.trim();
      const group = document.getElementById('input-group').value.trim();
      const password = _mode === 'join'
        ? document.getElementById('input-password').value.trim()
        : '';

      if (!username || !group) {
        showExportStatus('error', '설정 오류', '사용자 이름과 그룹 이름을 입력하세요.', '');
        return;
      }

      if (_mode === 'join' && !password) {
        showExportStatus('error', '설정 오류', '그룹 참여 모드에서는 비밀번호를 입력하세요.', '');
        return;
      }

      const cfg = {
        username: username,
        group_name: group,
        group_password: password,
        mode: _mode
      };

      sendToFusion('save_config', cfg);

      // Fusion → HTML callback이 안 돌아오는 경우에도 화면을 즉시 전환
      onConfigSaved(cfg);
    }

    function onConfigSaved(cfg) {
      document.getElementById('setup-section').style.display = 'none';
      document.getElementById('main-section').style.display = 'block';

      document.getElementById('disp-group').textContent = cfg.group_name || '—';
      document.getElementById('disp-pw').textContent = cfg.group_password
        ? '●'.repeat(cfg.group_password.length)
        : '—';
      document.getElementById('disp-me').textContent = cfg.username || '—';
    }

    // ── 모델 추출 ───────────────────────────────────────────────────────────────
    function exportModel() {
      const username = document.getElementById('disp-me').textContent.trim();

      const btn = document.getElementById('btn-export');
      btn.disabled = true;
      btn.textContent = '⏳ 추출 중...';

      showExportStatus(
        'success',
        '모델 추출 시작',
        'CAD 모델에서 meshes와 metadata.json을 생성하는 중입니다.',
        ''
      );

      sendToFusion('export_model', {
        username: username && username !== '—' ? username : undefined
      });
    }

    function onExportDone(d) {
      const btn = document.getElementById('btn-export');
      btn.disabled = false;
      btn.textContent = '⬇ 현재 CAD 모델 추출';

      const bodyCount = d.body_count ?? 0;
      const jointCount = d.joint_count ?? 0;
      const warningCount = d.warning_count ?? 0;

      showExportStatus(
        'success',
        '모델 추출 완료',
        `bodies: ${bodyCount}, joints: ${jointCount}, warnings: ${warningCount}`,
        d.metadata_path ? `metadata: ${d.metadata_path}` : ''
      );
    }

    function onExportError(d) {
      const btn = document.getElementById('btn-export');
      btn.disabled = false;
      btn.textContent = '⬇ 현재 CAD 모델 추출';

      showExportStatus(
        'error',
        '모델 추출 실패',
        d.message || '알 수 없는 오류가 발생했습니다.',
        d.action ? `action: ${d.action}` : ''
      );
    }

    function showExportStatus(kind, title, body, small) {
      const box = document.getElementById('export-status');
      box.className = 'status-box ' + (kind === 'error' ? 'error' : 'success');

      document.getElementById('export-status-title').textContent = title || '';
      document.getElementById('export-status-body').textContent = body || '';
      document.getElementById('export-status-small').textContent = small || '';
    }

    // ── 서버 상태 수신 ──────────────────────────────────────────────────────────
    let _paused = false;

    function onStatus(s) {
      document.getElementById('server-dot').className =
        'dot-server-status' + (s.sim_running ? ' connected' : '');

      const simOn = s.sim_running;
      document.getElementById('btn-pause').disabled = !simOn;
      document.getElementById('btn-qr').disabled = !simOn;
      document.getElementById('hint-idle').style.display = simOn ? 'none' : 'block';

      _paused = s.paused;
      document.getElementById('btn-pause').textContent = _paused ? '▶ 재개' : '⏸ 일시정지';

      const list = document.getElementById('member-list');
      list.innerHTML = '';

      (s.members || []).forEach(m => {
        const row = document.createElement('div');
        row.className = 'member-row';
        row.innerHTML = `
          <span class="member-name${m.is_me ? ' me' : ''}">${m.name}${m.is_me ? ' (나)' : ''}</span>
          <div class="indicators">
            <div class="ind ${m.server ? 'orange' : ''}" title="서버"></div>
            <div class="ind ${m.client ? 'blue' : ''}" title="클라이언트"></div>
            <div class="ind ${m.sim ? 'green' : ''}" title="시뮬레이션"></div>
          </div>`;
        list.appendChild(row);
      });
    }

    // ── 버튼 핸들러 ────────────────────────────────────────────────────────────
    function togglePause() { sendToFusion(_paused ? 'resume' : 'pause', {}); }
    function showQr()      { sendToFusion('qr_show', {}); }

    // ── 시작 시 config 요청 ─────────────────────────────────────────────────────
    window.addEventListener('load', () => sendToFusion('get_config', {}));
  </script>
</body>
</html>
