<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CADverse</title>
  <style>
    :root {
      --bg-primary:   #1e1e1e;
      --bg-secondary: #2a2a2a;
      --bg-input:     #2d2d2d;
      --border:       #333;
      --border-focus: #e07b39;
      --text-primary: #d4d4d4;
      --text-secondary: #888;
      --text-bright:  #ffffff;
      --accent:       #e07b39;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-primary:   #f3f3f3;
        --bg-secondary: #e8e8e8;
        --bg-input:     #ffffff;
        --border:       #cccccc;
        --border-focus: #e07b39;
        --text-primary: #1e1e1e;
        --text-secondary: #666666;
        --text-bright:  #000000;
        --accent:       #e07b39;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 12px;
    }

    /* ── 헤더 ── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-bright);
    }
    .dot-server-status {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--border);
    }
    .dot-server-status.connected { background: #e07b39; }

    /* ── 구분선 ── */
    hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

    /* ── 섹션 레이블 ── */
    .section-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    /* ── 설정 폼 (미설정 시 표시) ── */
    #setup-section { display: block; }
    #main-section  { display: none; }

    .field { margin-bottom: 8px; }
    .field label {
      display: block;
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 3px;
    }
    .field input {
      width: 100%;
      padding: 5px 8px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
    }
    .field input:focus { border-color: var(--border-focus); }

    /* ── 버튼 ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .35; cursor: default; }

    .btn-primary  { background: var(--accent); color: #fff; width: 100%; }
    .btn-outline  { background: transparent; border: 1px solid var(--border); color: var(--text-primary); }
    .btn-pause    { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); flex: 1; }

    .controls-row {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }

    /* ── 그룹 정보 ── */
    .info-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 10px;
      margin-bottom: 2px;
    }
    .info-grid .key   { color: var(--text-secondary); }
    .info-grid .value { color: var(--text-primary); word-break: break-all; }

    /* ── 그룹원 리스트 ── */
    .member-list { display: flex; flex-direction: column; gap: 6px; }

    .member-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      background: var(--bg-secondary);
      border-radius: 4px;
    }
    .member-name { font-size: 13px; color: var(--text-primary); }
    .member-name.me { color: var(--text-bright); font-weight: 600; }

    .indicators { display: flex; gap: 5px; align-items: center; }
    .ind {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--border);
    }
    .ind.orange { background: #e07b39; }
    .ind.blue   { background: #4a9edd; }
    .ind.green  { background: #4ec94e; }

    /* ── 모드 토글 ── */
    .mode-toggle {
      display: flex;
      background: var(--bg-secondary);
      border-radius: 4px;
      padding: 2px;
      margin-bottom: 12px;
    }
    .mode-btn {
      flex: 1;
      padding: 5px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      border-radius: 3px;
      transition: all .15s;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* ── 안내 문구 ── */
    .hint {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <div class="header">
    <div class="dot-server-status" id="server-dot"></div>
    <h1>CADverse</h1>
  </div>

  <!-- ══ 초기 설정 섹션 (config 없을 때) ══ -->
  <div id="setup-section">
    <div class="section-label">초기 설정</div>

    <div class="mode-toggle">
      <button class="mode-btn active" id="mode-create" onclick="setMode('create')">새 그룹 만들기</button>
      <button class="mode-btn"        id="mode-join"   onclick="setMode('join')">그룹 참여</button>
    </div>

    <div class="field">
      <label>사용자 이름</label>
      <input type="text" id="input-username" placeholder="예: kim">
    </div>
    <div class="field">
      <label>그룹 이름</label>
      <input type="text" id="input-group" placeholder="예: lab01">
    </div>
    <div class="field" id="field-password" style="display:none">
      <label>그룹 비밀번호</label>
      <input type="password" id="input-password" placeholder="비밀번호">
    </div>
    <button class="btn btn-primary" onclick="saveConfig()">시작</button>
  </div>

  <!-- ══ 메인 섹션 (설정 완료 후) ══ -->
  <div id="main-section">

    <!-- 그룹 정보 -->
    <div class="section-label">그룹 정보</div>
    <div class="info-grid">
      <span class="key">그룹</span>   <span class="value" id="disp-group">—</span>
      <span class="key">비밀번호</span><span class="value" id="disp-pw">—</span>
      <span class="key">나</span>     <span class="value" id="disp-me">—</span>
    </div>

    <hr>

    <!-- 컨트롤 버튼 -->
    <div class="controls-row">
      <button class="btn btn-pause" id="btn-pause" disabled onclick="togglePause()">
        ⏸ 일시정지
      </button>
      <button class="btn btn-outline" id="btn-qr" disabled onclick="showQr()">
        QR 표시
      </button>
    </div>

    <hr>

    <!-- 그룹원 리스트 -->
    <div class="section-label">그룹원</div>
    <div class="member-list" id="member-list">
      <!-- JS로 동적 생성 -->
    </div>

    <p class="hint" id="hint-idle">CAD 파일을 저장하면 시뮬레이션이 시작됩니다.</p>
  </div>

  <script>
    // ── Fusion 360 → JS 메시지 수신 ────────────────────────────────────────────
    window.fusionJavaScriptHandler = {
      handleData: function(action, data) {
        const d = data ? JSON.parse(data) : {};
        if (action === 'config_saved') onConfigSaved(d);
        if (action === 'status')       onStatus(d);
      }
    };

    // ── JS → Fusion 360 메시지 송신 ────────────────────────────────────────────
    function sendToFusion(action, data) {
      if (window.adsk) window.adsk.fusionSendData(action, JSON.stringify(data));
    }

    // ── 모드 전환 ───────────────────────────────────────────────────────────────
    let _mode = 'create';
    function setMode(mode) {
      _mode = mode;
      document.getElementById('mode-create').classList.toggle('active', mode === 'create');
      document.getElementById('mode-join').classList.toggle('active',   mode === 'join');
      document.getElementById('field-password').style.display = mode === 'join' ? 'block' : 'none';
    }

    // ── 초기 설정 저장 ──────────────────────────────────────────────────────────
    function saveConfig() {
      const username = document.getElementById('input-username').value.trim();
      const group    = document.getElementById('input-group').value.trim();
      const password = _mode === 'join' ? document.getElementById('input-password').value.trim() : '';
      if (!username || !group) return;
      if (_mode === 'join' && !password) return;
      sendToFusion('save_config', { username, group_name: group, group_password: password, mode: _mode });
    }

    function onConfigSaved(cfg) {
      document.getElementById('setup-section').style.display = 'none';
      document.getElementById('main-section').style.display  = 'block';
      document.getElementById('disp-group').textContent = cfg.group_name;
      document.getElementById('disp-pw').textContent    = '●'.repeat(cfg.group_password.length);
      document.getElementById('disp-me').textContent    = cfg.username;
    }

    // ── 서버 상태 수신 ──────────────────────────────────────────────────────────
    let _paused = false;

    function onStatus(s) {
      // 서버 연결 상태 dot
      document.getElementById('server-dot').className =
        'dot-server-status' + (s.sim_running ? ' connected' : '');

      // 버튼 활성화
      const simOn = s.sim_running;
      document.getElementById('btn-pause').disabled = !simOn;
      document.getElementById('btn-qr').disabled    = !simOn;
      document.getElementById('hint-idle').style.display = simOn ? 'none' : 'block';

      // 일시정지 버튼 라벨
      _paused = s.paused;
      document.getElementById('btn-pause').textContent = _paused ? '▶ 재개' : '⏸ 일시정지';

      // 그룹원 리스트 갱신
      const list = document.getElementById('member-list');
      list.innerHTML = '';
      (s.members || []).forEach(m => {
        const row = document.createElement('div');
        row.className = 'member-row';
        row.innerHTML = `
          <span class="member-name${m.is_me ? ' me' : ''}">${m.name}${m.is_me ? ' (나)' : ''}</span>
          <div class="indicators">
            <div class="ind ${m.server  ? 'orange' : ''}" title="서버"></div>
            <div class="ind ${m.client  ? 'blue'   : ''}" title="클라이언트"></div>
            <div class="ind ${m.sim     ? 'green'  : ''}" title="시뮬레이션"></div>
          </div>`;
        list.appendChild(row);
      });
    }

    // ── 버튼 핸들러 ────────────────────────────────────────────────────────────
    function togglePause() { sendToFusion(_paused ? 'resume' : 'pause', {}); }
    function showQr()      { sendToFusion('qr_show', {}); }

    // ── 시작 시 config 요청 ─────────────────────────────────────────────────────
    window.addEventListener('load', () => sendToFusion('get_config', {}));
  </script>
</body>
</html>
