[package]
name = "sim_server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sim_server"
path = "src/main.rs"

[dependencies]
server = { path = "crates/server" }
sim_manager = { path = "crates/sim_manager" }
cad_data_loader = { path = "crates/cad_data_loader" }
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

[workspace]
members = [
    "crates/server",
    "crates/sim_manager",
    "crates/cad_data_loader"
]
resolver = "2"

[workspace.dependencies]
# 비동기 런타임
tokio = { version = "1.42", features = ["full"] }

# 웹 서버 프레임워크 (WebSocket 기본 지원)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# JSON 직렬화/역직렬화
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Python 인터프리터 연동
pyo3 = { version = "0.23", features = ["auto-initialize"] }

# 로깅
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 에러 핸들링
anyhow = "1.0"
thiserror = "2.0"

# 환경 변수 관리
dotenvy = "0.15"
