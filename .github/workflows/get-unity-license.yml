name: Get Unity License

on:
  workflow_dispatch: {}

jobs:
  get-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: game-ci/unity-activate@v4
        id: activate
        env:
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.9f1

      - name: Upload license file
        uses: actions/upload-artifact@v4
        with:
          name: unity-license
          path: ${{ steps.activate.outputs.UNITY_LICENSE_FILE }}
          retention-days: 1
